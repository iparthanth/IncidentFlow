# ---------------------------------------------------------------------------
# IncidentFlow edge.
#
# One origin serves the SPA, the REST API and the realtime stream. That is a
# deliberate architectural choice, not a convenience: it makes the refresh
# cookie same-site, removes CORS entirely, and means the browser opens one set
# of connections instead of three.
# ---------------------------------------------------------------------------

upstream api_fpm {
    server api:9000;
    keepalive 16;
}

upstream realtime_service {
    server realtime:3001;
    keepalive 32;
}

upstream web_spa {
    server web:80;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # --- Security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # No CDNs, no external fonts, no inline scripts. The SPA is entirely
    # self-hosted, so the policy can be this tight — and an incident dashboard
    # should render even when the wider internet is the thing that is broken.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    limit_conn per_ip_conn 64;

    # --- Realtime stream ---------------------------------------------------
    # Everything here exists to stop a proxy from breaking a long-lived stream.
    location /realtime/ {
        proxy_pass http://realtime_service/;
        proxy_http_version 1.1;

        # Buffering is the classic SSE killer: nginx would hold events until
        # its buffer filled, turning a live feed into a batch delivery.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id_final;

        # A stream is supposed to stay quiet for long stretches. The default
        # 60s read timeout would sever every idle connection once a minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Instructs any downstream proxy not to buffer either.
        add_header X-Accel-Buffering "no" always;
    }

    # --- WebSocket transport ----------------------------------------------
    location /ws {
        proxy_pass http://realtime_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # --- Authentication endpoints -----------------------------------------
    # A tighter bucket in front of login and refresh, before PHP is started.
    location ~ ^/api/v1/auth/(login|register|refresh)$ {
        limit_req zone=api_auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # --- REST API ----------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Probes are exempt from rate limiting: a load balancer checking liveness
    # must never be throttled into reporting the service as down.
    location = /api/v1/health/live { try_files $uri /index.php?$query_string; }
    location = /api/v1/health/ready { try_files $uri /index.php?$query_string; }

    # --- Queue dashboard ---------------------------------------------------
    location /horizon {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass api_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_REQUEST_ID $request_id_final;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;

        # Streaming CSV exports must reach the client as they are produced
        # rather than being assembled in a buffer first.
        fastcgi_keep_conn on;

        internal;
    }

    # Nothing else may execute PHP. Without this, an uploaded file that lands
    # anywhere under the document root becomes remote code execution.
    location ~ \.php$ {
        return 404;
    }

    # Deny access to anything that should never have been reachable at all.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- SPA ---------------------------------------------------------------
    # Last, so every API and realtime prefix is matched first.
    location / {
        proxy_pass http://web_spa;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
