user  nginx;
# One worker per core, chosen by nginx itself rather than guessed here.
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access logs, matching the JSON the application emits so one
    # tool can read both. `request_id` is the join key across nginx, Laravel
    # and the realtime node.
    log_format json_combined escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request_id":"$request_id_final",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"duration_ms":$request_time_ms,'
          '"upstream_ms":"$upstream_response_time",'
          '"referrer":"$http_referer",'
          '"user_agent":"$http_user_agent"'
        '}';

    map $request_time $request_time_ms {
        default $request_time;
    }

    # Honour a caller-supplied correlation id when present, mint one otherwise.
    # Either way every downstream service sees exactly one.
    map $http_x_request_id $request_id_final {
        default $http_x_request_id;
        ""      $request_id;
    }

    # WebSocket upgrade handshake: `Connection` must be "upgrade" only when the
    # client actually asked for it, and "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    access_log /dev/stdout json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_max_body_size 12M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Rate limiting at the edge, in front of the application's own limits.
    # Two layers because they stop different things: nginx sheds a flood before
    # PHP is ever started, while Laravel's limiter knows who the user is.
    limit_req_zone $binary_remote_addr zone=api_general:16m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:8m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=per_ip_conn:16m;

    include /etc/nginx/conf.d/*.conf;
}
