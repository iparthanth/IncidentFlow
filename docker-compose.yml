# ---------------------------------------------------------------------------
# IncidentFlow — development stack
#
#   docker compose up --build
#   open http://localhost:8080
#
# Everything is on one origin (nginx on :8080), which is exactly how it runs in
# production — so the refresh cookie, CORS behaviour and SSE proxying are all
# exercised in development rather than discovered at deploy time.
#
# Ports for PostgreSQL, Redis and Mailpit are published for convenience here.
# docker-compose.prod.yml deliberately publishes none of them.
# ---------------------------------------------------------------------------

name: incidentflow

x-api-environment: &api-environment
  APP_NAME: IncidentFlow
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: ${APP_KEY:-base64:0000000000000000000000000000000000000000000=}
  APP_URL: http://localhost:8080
  APP_FRONTEND_URL: http://localhost:8080
  LOG_CHANNEL: stack
  LOG_STACK: json
  LOG_LEVEL: debug
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: incidentflow
  DB_USERNAME: incidentflow
  DB_PASSWORD: incidentflow
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REALTIME_ENABLED: "true"
  # Only the per-IP ceiling is raised, and only here. The end-to-end suite
  # signs in seven times from one browser inside a minute, which at the
  # production ceiling looks exactly like credential stuffing. The per-identity
  # limit is deliberately left at its default: those sign-ins use different
  # accounts, so it is not the binding constraint, and leaving it alone keeps
  # "six wrong passwords for one account gets refused" true inside Docker --
  # which is what docs/running-incidentflow.pdf tells a reader to try.
  AUTH_RATE_LIMIT_PER_IP: "200"
  REALTIME_CHANNEL_PREFIX: incidentflow
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: incidents@incidentflow.local
  # Plain HTTP locally, so the cookie cannot carry Secure or the browser drops
  # it silently and every refresh fails.
  JWT_REFRESH_COOKIE_SECURE: "false"
  JWT_REFRESH_COOKIE_SAMESITE: lax

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incidentflow
      POSTGRES_USER: incidentflow
      POSTGRES_PASSWORD: incidentflow
      # Speeds up initdb and keeps collation stable across host locales.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns success while the server is still starting up, so
      # the user and database are named explicitly to test a real connection.
      test: ["CMD-SHELL", "pg_isready -U incidentflow -d incidentflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # `--appendonly no`: everything in Redis here is cache, queue and pub/sub.
    # PostgreSQL is the source of truth, so durability would buy nothing and
    # cost fsyncs on every job.
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Catches every outgoing email. Nothing leaves the host, which is the only
    # acceptable way to develop against a system that sends pages.
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build:
      context: ./api
      target: runtime
    environment: *api-environment
    volumes:
      # Live code mount for development; the production compose file has none.
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
      - jwt-keys:/var/www/html/storage/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        # The schema has to exist before these serve or process anything. This
        # also makes `--wait` tolerate a run-once container: without an explicit
        # completion condition Compose treats an exited service as a failure and
        # `up --wait` returns 1 even when every other service is healthy.
        condition: service_completed_successfully

  # Runs migrations exactly once, then exits. Keeping this out of the API
  # container's entrypoint is what stops three replicas racing each other
  # through the same schema change.
  migrate:
    build:
      context: ./api
      target: runtime
    environment: *api-environment
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --force"]
    volumes:
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
      - jwt-keys:/var/www/html/storage/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  horizon:
    build:
      context: ./api
      target: runtime
    environment: *api-environment
    command: ["php", "artisan", "horizon"]
    healthcheck:
      # The image's probe checks php-fpm on :9000, which this service does not
      # run -- it runs `php artisan horizon`. Inherited unchanged it can never
      # pass, so the container sits permanently "unhealthy" while processing
      # jobs perfectly well, and `up --wait` fails on an otherwise sound stack.
      #
      # Disabled rather than replaced: the worker is PID 1 here, so if it dies
      # the container dies with it -- "running" already is the health signal.
      # `horizon:status` is not an alternative: it reads cluster state from
      # Redis and returns 0 from any container, including ones not running
      # Horizon at all.
      disable: true
    volumes:
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
      - jwt-keys:/var/www/html/storage/keys
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # The schema has to exist before these serve or process anything. This
        # also makes `--wait` tolerate a run-once container: without an explicit
        # completion condition Compose treats an exited service as a failure and
        # `up --wait` returns 1 even when every other service is healthy.
        condition: service_completed_successfully
    # Horizon must be allowed to finish the job it is holding before it dies.
    stop_grace_period: 30s

  scheduler:
    build:
      context: ./api
      target: runtime
    environment: *api-environment
    # `schedule:work` is the long-running equivalent of a crontab entry, which
    # keeps the whole schedule in routes/console.php rather than split between
    # the repository and the host.
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      # Same reasoning as horizon: this runs `schedule:work`, not php-fpm, so
      # the inherited probe can never pass. The scheduler loop is PID 1, so the
      # container exiting is the real failure signal.
      disable: true
    volumes:
      - ./api:/var/www/html
      - api-vendor:/var/www/html/vendor
      - jwt-keys:/var/www/html/storage/keys
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        # The schema has to exist before these serve or process anything. This
        # also makes `--wait` tolerate a run-once container: without an explicit
        # completion condition Compose treats an exited service as a failure and
        # `up --wait` returns 1 even when every other service is healthy.
        condition: service_completed_successfully

  realtime:
    build:
      context: ./realtime
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: debug
      REDIS_URL: redis://redis:6379
      REDIS_CHANNEL_PREFIX: incidentflow
      # The public half only. The realtime tier verifies tokens and must never
      # be able to mint them.
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      JWT_ISSUER: incidentflow-api
      JWT_AUDIENCE: incidentflow-realtime
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        # service_healthy, not service_started. The API generates the RS256 pair
        # in its entrypoint, after waiting for PostgreSQL, and this service reads
        # the public half from the shared volume at boot. Releasing on "container
        # started" let realtime read the path before the file existed, so it died
        # with ENOENT. php-fpm only listens once the entrypoint has finished,
        # which makes "healthy" an accurate proxy for "the keys exist".
        condition: service_healthy

  web:
    build:
      context: ./web
      target: runtime
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx serves public/index.php through FastCGI, so it needs the same
      # document root the API container sees.
      - ./api:/var/www/html:ro
    depends_on:
      - api
      - realtime
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  api-vendor:
  jwt-keys:
