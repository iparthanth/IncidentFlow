server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns client-side routing, so any unknown path must return
    # index.html rather than a 404 — otherwise a hard refresh on
    # /incidents/42 breaks while the same page reached by clicking works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, which makes these safe to cache
    # essentially forever: a new deploy produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached, or a browser keeps loading the old
    # bundle's asset names after a deploy and the app breaks with a 404 on a
    # chunk nobody can reproduce locally.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
}
