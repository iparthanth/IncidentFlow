; IncidentFlow PHP runtime tuning.

; --- Limits -----------------------------------------------------------------
memory_limit = 256M
max_execution_time = 30
; Streaming CSV exports must not be cut short by the execution timeout, but a
; request that hangs must still die. 30s is the ceiling for ordinary requests;
; the export controller streams in chunks and resets the timer as it writes.
post_max_size = 12M
upload_max_filesize = 10M

; --- Errors -----------------------------------------------------------------
; Never render errors into the response body: it is both useless to an API
; client and a disclosure risk. Everything goes to stderr, which the container
; runtime collects.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; --- OPcache ----------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The filesystem inside an image never changes, so stat()-ing every file on
; every request is pure waste. This is the single biggest PHP performance win
; in a container, and it is only safe *because* the code is immutable.
opcache.validate_timestamps = 0
opcache.save_comments = 1

; --- Realpath cache ---------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Security ---------------------------------------------------------------
expose_php = Off
; The API never renders HTML, so a cookie is never read by script here — but
; defence in depth costs nothing.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
