; Runs nginx and PHP-FPM as one unit for single-port PaaS hosts.
;
; Both log to stdout: on Render there is no log file to go and read, and a
; process writing to /var/log in a container with an ephemeral filesystem is
; writing into the void.
;
; autorestart is deliberately false. If either process dies the container
; should die with it so the platform restarts it cleanly — a container that
; keeps running with nginx up and PHP-FPM dead passes a TCP health check while
; serving 502 to every request, which is the worst possible state.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=www-data

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; Bring the whole container down if either child exits, rather than limping on.
[eventlistener:shutdown]
command=sh -c "printf 'READY\n'; while read -r line; do kill -TERM $PPID; done"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
