[www]
; Logs to the container's stdout/stderr rather than to files inside the image.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

; Dynamic process management: a fixed pool either wastes memory when idle or
; queues requests under load. `max_children` should be sized against the
; container's memory limit divided by peak per-request memory.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers periodically. PHP-FPM leaks nothing on its own, but third
; party extensions do, and a bounded worker lifetime turns a slow leak into a
; non-event.
pm.max_requests = 500

; Log any request slower than this with a stack trace, so a mystery latency
; spike leaves evidence instead of only a metric.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; FPM's own status and ping endpoints, reachable only from inside the pod.
pm.status_path = /fpm-status
ping.path = /fpm-ping
